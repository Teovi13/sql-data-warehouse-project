
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'data_warehouse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'data_warehouse'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  data_warehouse:
    +persist_docs:
      relation: true
      columns: true
    silver:
      +materialized: table
      +schema: silver
      +as_columnstore: false
    gold:
      +materialized: view
      +schema: gold

data_tests:
  data_warehouse:
    +store_failures: true
    +as_columnstore: false

vars:
  reference_date: "{{ run_started_at.strftime('%Y-%m-%d') }}"
  # Validity bounds of the type 2 tables. Never change scd_end_date once a
  # snapshot has data: its current rows already store this value.
  scd_start_date: '1900-01-01'
  scd_end_date: '9999-12-31'

snapshots:
  data_warehouse:
    +schema: snapshots
    +as_columnstore: false
    +persist_docs:
      relation: true
      columns: true

flags:
  # Never widen a column across type families (varchar -> nvarchar,
  # int -> bigint) automatically: on a snapshot, which cannot be rebuilt,
  # a change like that in Silver must be reviewed, not applied silently.
  dbt_sqlserver_enable_safe_type_expansion: false
