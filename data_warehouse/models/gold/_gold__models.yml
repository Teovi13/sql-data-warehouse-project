# =============================================================================
# Models: Gold layer
# =============================================================================
# Purpose:
#     Generic data tests for the star schema: parity with the legacy Gold
#     views (surrogate keys excluded: they are hashes in dbt, ROW_NUMBER
#     values in the legacy views; tests/gold checks that they still resolve
#     to the same customers and products), unique surrogate and business
#     keys in the dimensions, attributes that must never be NULL, the grain
#     of the fact table, and its foreign keys (not_null + relationships,
#     because relationships alone skips NULL keys).
# =============================================================================

models:
  - name: dim_customers
    data_tests:
      - parity_with:
          arguments:
            legacy: source('legacy_gold', 'dim_customers')
            exclude_columns: ['customer_key']
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_number
        data_tests:
          - unique
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: gender
        data_tests:
          - not_null

  - name: dim_products
    data_tests:
      - parity_with:
          arguments:
            legacy: source('legacy_gold', 'dim_products')
            exclude_columns: ['product_key']
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
      - name: product_number
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null

  - name: fact_sales
    data_tests:
      - parity_with:
          arguments:
            legacy: source('legacy_gold', 'fact_sales')
            exclude_columns: ['customer_key', 'product_key']
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['order_number', 'product_key']
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
